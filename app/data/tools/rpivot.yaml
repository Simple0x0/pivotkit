id: rpivot
name: Rpivot
description: "Python 2 reverse SOCKS4 tunnel — useful when only outbound HTTP is allowed from the target."

blog: /blogs/rpivot

category: socks

os:
  attacker:
    - linux
  target:
    - linux
    - windows

requires_root: false

capabilities:
  - reverse-connection
  - requires-agent

notes:
  - "Python 2 is required on both the attacker and the target."
  - "Source code available at https://github.com/klsecservices/rpivot"
  - "Supports NTLM proxy bypass for environments with an authenticating HTTP proxy."
